<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">QTS capability blueprint</title>
  <desc id="desc">Four connected capability layers from architecture through operations with a central control spine.</desc>
  <rect width="1200" height="540" fill="#eaf2fb"/>
  <g stroke="#123a9c" stroke-opacity=".12" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200"/>
    <path d="M120 0v540M240 0v540M360 0v540M480 0v540M600 0v540M720 0v540M840 0v540M960 0v540M1080 0v540"/>
  </g>
  <path d="M120 92V448" stroke="#0b1f5c" stroke-width="3"/>
  <circle cx="120" cy="270" r="44" fill="#0b1f5c" stroke="#38d9ff" stroke-width="3"/>
  <text x="120" y="264" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">QTS</text>
  <text x="120" y="286" text-anchor="middle" fill="#78c4ff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYSTEM</text>
  <g fill="#ffffff" stroke="#b8cbe0" stroke-width="1">
