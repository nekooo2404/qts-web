    <circle cx="220" cy="95" r="5"/><circle cx="220" cy="205" r="5"/><circle cx="220" cy="315" r="5"/><circle cx="220" cy="425" r="5"/>
  </g>
  <text x="220" y="508" fill="#123a9c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURE LOOP / CONTROLLED HANDOFF</text>
