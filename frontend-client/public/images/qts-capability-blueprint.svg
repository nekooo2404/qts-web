    <text x="252" y="198" font-size="12" letter-spacing="2">L02</text>
    <text x="252" y="308" font-size="12" letter-spacing="2">L03</text>
    <text x="252" y="418" font-size="12" letter-spacing="2">L04</text>
  </g>
  <g fill="#0b1f5c" font-family="Arial, sans-serif" font-size="23" font-weight="700">
    <text x="320" y="101">ARCHITECTURE</text>
    <text x="320" y="211">INTEGRATION</text>
    <text x="320" y="321">SECURITY</text>
    <text x="320" y="431">OPERATIONS</text>
